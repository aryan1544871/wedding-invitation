<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aryan &amp; Anshu — Wedding Invitation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#6b3b2a,#251313 75%);font-family:Georgia,serif;color:#572a1c}.scene{width:min(100%,760px);text-align:center}.hint{color:#f8e5bf;font:12px Arial,sans-serif;margin:16px}.stage{position:relative;aspect-ratio:.72;width:min(100%,560px);max-height:85vh;margin:0 auto;perspective:1000px;cursor:pointer}.cover,.card{position:absolute;inset:0;border:2px solid #c79a50;box-shadow:0 20px 50px #0008}.cover{background:linear-gradient(145deg,#fff9ec,#e4c58d);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:22px;transition:opacity .7s,transform .7s;overflow:hidden}.cover:before{content:"";position:absolute;inset:12px;border:1px solid #b98740;box-shadow:inset 0 0 0 5px #fff8e8,inset 0 0 0 6px #d2a55e;pointer-events:none}.heading{position:relative;z-index:1;color:#8b571e}.heading .flourish{font-size:42px}.heading h1{font-size:clamp(28px,5vw,48px);font-weight:normal;font-style:italic;margin:5px}.heading p{font:12px Arial,sans-serif;letter-spacing:.22em}.envelope{position:relative;z-index:1;width:82%;height:44%;border:2px solid #c49a52;background:linear-gradient(145deg,#fffdf5,#e8d1a5);box-shadow:0 10px 24px #6e431d44;overflow:hidden}.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.5%,#c99c58 50%,transparent 50.5%),linear-gradient(215deg,transparent 49.5%,#c99c58 50%,transparent 50.5%)}.flap{position:absolute;top:0;left:0;width:100%;height:62%;background:linear-gradient(150deg,#fff1d1,#dfbd7d);clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:1px solid #bd8b45}.seal{position:absolute;z-index:2;top:55%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#e3bb62,#833e17 75%);border:4px double #f7dfa4;color:#fff0c9;font-size:30px;box-shadow:0 4px 12px #5b2b18aa}.prompt{position:relative;z-index:1;background:#791b22;color:#fff2d7;border:1px solid #d9b16a;border-radius:30px;padding:13px 20px;font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.card{opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .7s,transform .7s,visibility .7s;overflow:hidden;padding:0;background:#fffdf3;display:grid;place-items:center}.card img{display:block;width:100%;height:100%;object-fit:contain;background:#fffdf3}.card .orn{color:#b9853e;font-size:24px}.card h2{font-size:clamp(27px,5vw,43px);font-weight:normal;font-style:italic;color:#791b22;margin:10px 0}.small{font:12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}.names{font-size:clamp(22px,4vw,34px);font-style:italic;color:#791b22;margin:14px 0}.heart{color:#b9853e}.rule{border-top:1px solid #d4b174;margin:18px auto 14px;max-width:420px}.detail{font-size:clamp(14px,2vw,17px);line-height:1.6;margin:8px}.thanks{font-style:italic;margin-top:16px}.thanks strong{display:block;font-size:21px;color:#791b22;font-style:normal;margin-top:5px}.stage.open .cover{opacity:0;transform:scale(1.04);pointer-events:none}.stage.open .card{opacity:1;visibility:visible;transform:scale(1)}@media(max-width:480px){.stage{aspect-ratio:.72;max-height:none}.cover{padding:18px}.envelope{width:90%;height:38%}.seal{width:52px;height:52px;font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="scene">
<div class="stage" id="stage" role="button" tabindex="0" aria-label="Open wedding invitation">
<section class="cover"><div class="heading"><div class="flourish">❦</div><h1>You're Invited</h1><p>TO OUR WEDDING</p></div><div class="envelope" aria-hidden="true"><div class="flap"></div><div class="seal">♡</div></div><div class="prompt">Click the Envelope to Reveal</div></section>
<section class="card" aria-live="polite"><img id="invitationImage" alt="Original wedding invitation card" /></section>
</div><p class="hint">Tap the envelope to open the invitation. Tap again to close it.</p>
</main><script src="./config.js"></script><script>
const stage=document.getElementById("stage");const invitationImage=document.getElementById("invitationImage");const imageUrl=(window.INVITATION_IMAGE_URL||"").trim();if(imageUrl){invitationImage.src=imageUrl;}else{invitationImage.alt="Set INVITATION_IMAGE_URL in config.js to your hosted invitation image URL.";invitationImage.style.display="none";}function toggle(){if(!imageUrl){alert("Add your hosted invitation image URL in config.js first.");return;}stage.classList.toggle("open");stage.setAttribute("aria-label",stage.classList.contains("open")?"Close wedding invitation":"Open wedding invitation");}stage.addEventListener("click",toggle);stage.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
</script></body></html>
